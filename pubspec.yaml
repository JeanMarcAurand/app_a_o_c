name: app_a_o_c
description: Application pour l'Association des Oléiculteurs de Callian.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path_provider: ^2.1.5 #
  csv: ^6.0.0
  intl: ^0.20.2 #
  file_picker: ^10.1.9 #
  qr_flutter: ^4.1.0 #
  table_calendar: ^3.2.0 #
  package_info_plus: ^8.3.0 


  english_words: ^4.0.0
  provider: ^6.1.5 #
  
  mask_text_input_formatter: ^2.9.0
  cupertino_icons: ^1.0.8 #

  shared_preferences: ^2.5.3 #

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 #

flutter_launcher_icons:
  image_path: "assets/icon/iconeAppOlive512x512.png"
  android: true
  ios: true
  windows:
    generate: true
  macos:    
    generate: true
  web:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/iconeAppOlive512x512.png
    - assets/data/adherents_demo.csv
    - assets/data/parametres_demo.json
    - assets/data/agenda_demo.json
    